[workspace]
name = "pkpd-data-wrangling"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[package]
name = "pkpd-data-wrangling"
version = "0.1.0"
description = "PK/PD Data Wrangling with Quarto and R"
authors = ["한성필"]

[dependencies]
r-base = ">=4.3"
r-tidyverse = "*"
r-mrgsolve = "*"
r-gt = "*"
r-gtsummary = "*"
r-patchwork = "*"
r-noncompart = "*"
r-haven = "*"
r-readxl = "*"
r-writexl = "*"
r-lubridate = "*"
r-scales = "*"
r-rcolorbrewer = "*"
r-ggrepel = "*"
r-corrplot = "*"
r-broom = "*"
r-glmnet = "*"
r-naniar = "*"
r-plotly = "*"
r-ragg = "*"
r-showtext = "*"
r-survival = "*"
r-survminer = "*"
r-viridis = "*"
r-zoo = "*"
r-jsonlite = "*"
r-forcats = "*"
quarto = "*"

[tasks]
install-pknca = "R -e \"if (!require('PKNCA')) install.packages('PKNCA', repos='https://cloud.r-project.org')\""
render = { cmd = "quarto render", depends-on = ["install-pknca"] }
